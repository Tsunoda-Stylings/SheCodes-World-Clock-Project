<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
     <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>SheCodes World Clock Project</title>
</head>
<body>
<div class="container">
      <h1>World Clock</h1>

      <select>
        <option value="">Select a city..</option>
        <option value="">London</option>
        <option value="">New York</option>
        <option value="">Auckland</option>
      </select>

      <div id="city">
        <div class="city" id="los-angeles">
          <div>
            <h2>Los Angeles</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
        <div class="city" id="paris">
          <div>
            <h2>Paris</h2>
            <div class="date"></div>
          </div>
          <div class="time"></div>
        </div>
      </div>
    </div>
    <footer>
        <p>This project was coded by <a href="https://github.com/KpopMama07" target="_blank">Jasmine Tsunoda</a> and is open sourced on 
            <a href="https://github.com/Tsunoda-Stylings/SheCodes-World-Clock-Project" target="_blank">Github</a> and hosted on 
            <a href="https://worldclocksprojects.netlify.app/" target="_blank">Netlify</a>.</p>
        <p>2026 SheCodes World Clock Project. All rights reserved.</p>
    </footer>
    <script src="javascript/index.js"></script>
</body>
</html>
